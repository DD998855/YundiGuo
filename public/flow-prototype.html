}
function refreshTaskCounts(){
  $("[data-home-mine-count]") && ($("[data-home-mine-count]").textContent=homeStatsText());
  const accountTasks=tasksForAccount();
  $$("[data-chat-todo]").forEach(el=>{const name=el.dataset.chatTodo;el.textContent=`${unfinished(accountTasks.filter(t=>t.sourceChat===name||t.context===name)).length} 项待处理`});
  const open=unfinished(myTasks(accountTasks));

  $("[data-count='overdue']") && ($("[data-count='overdue']").textContent=String(open.filter(t=>t.dueDate&&dueTimestamp(t)<dueTimestamp({dueDate:TODAY,dueTime:"00:00"})).length).padStart(2,"0"));
  $("[data-count='today']") && ($("[data-count='today']").textContent=String(open.filter(t=>t.dueDate===TODAY).length).padStart(2,"0"));

function currentHomeTaskView(){return $(".tasks [data-task-view].active")?.dataset.taskView||"list"}
function setHomeTaskView(viewName){
  $$("[data-panel]").forEach(panel=>{
    const active=panel.dataset.panel===viewName;
    panel.classList.remove("is-active");
    panel.hidden=!active;
    if(active)requestAnimationFrame(()=>panel.classList.add("is-active"));
  });
}
function currentTaskFilteredList(){
  const scoped=myTasks(tasksForAccount()),status=$("[data-task-filter].active")?.dataset.taskFilter||"open",risk=$("[data-risk-select]")?.value||"all";
  let list=status==="done"?scoped.filter(isDone):unfinished(scoped);
  if(risk==="risk") list=list.filter(t=>t.risk&&t.risk!=="—");
  return list.sort(status==="done"?compareCompletedTasks:compareTaskUrgency);
}
function taskTableFilteredHTML(){
  return taskSectionsHTML(currentTaskFilteredList());
}
function refreshHomeTaskRail(){
  if(!$(".tasks"))return;
  const openMine=unfinished(myTasks(tasksForAccount())).sort(compareTaskUrgency),view=currentHomeTaskView();
  $("#taskList") && ($("#taskList").innerHTML=taskRows(openMine));

function refreshTaskPageViews(){

}
function updateCompletedTaskDom(task){

  refreshTaskPageViews();
  refreshActiveDayModal();
  refreshProjectTaskSurfaces(task.project);
}
function completeTask(id){const task=tasks.find(t=>t.id===id);if(!task||task.owner!==currentUser)return;task.previousStatus=isDone(task)?task.previousStatus:task.status;task.status="已完成";task.completedAt=new Date().toISOString();saveTasks();$$(`[data-task-id="${id}"] .check`).forEach(c=>c.classList.add("done"));setTimeout(()=>{updateCompletedTaskDom(task);undoToast(task)},60)}
function restoreTask(id){const task=tasks.find(t=>t.id===id);if(!task||task.owner!==currentUser)return;task.status=task.previousStatus||"待开始";task.completedAt=null;task.previousStatus=null;saveTasks();updateCompletedTaskDom(task);toastMsg(`已取消完成“${task.title}”`)}
function bindTaskControls(){$$("[data-task-toggle]").forEach(b=>b.onclick=e=>{e.stopPropagation();const task=tasks.find(t=>t.id===b.dataset.taskToggle);if(!task)return;if(isDone(task))restoreTask(task.id);else completeTask(task.id)})}
async function copyOpenTasks(){const open=unfinished(myTasks(tasksForAccount())).sort(byDue);const text="我的任务\n\n"+open.map((t,i)=>`${i+1}. ${t.title}\n   所属项目：${t.context}\n   任务来源：${t.sourceChat} · ${t.speaker}\n   截止时间：${t.due}`).join("\n\n");try{await navigator.clipboard.writeText(text);toastMsg("已复制当前全部未完成任务")}catch{modal("复制任务",`<textarea style="width:100%;height:280px">${text}</textarea>`)}}
function bindTaskPageFilters(){
  const body=$("#taskTableBody");if(!body)return;
  const scoped=myTasks(tasksForAccount());
  const filteredList=()=>{
    const status=$("[data-task-filter].active")?.dataset.taskFilter||"open",risk=$("[data-risk-select]")?.value||"all";
    let list=status==="done"?scoped.filter(isDone):unfinished(scoped);
    if(risk==="risk") list=list.filter(t=>t.risk&&t.risk!=="—");
    return list.sort(status==="done"?compareCompletedTasks:compareTaskUrgency);
  };
  const refresh=()=>{body.innerHTML=taskSectionsHTML(filteredList());$("#taskCalendarView").innerHTML=taskCalendarHTML();bindTaskControls();bindCalendarControls()};
  $$("[data-task-filter]").forEach(b=>b.onclick=()=>{$$("[data-task-filter]").forEach(x=>x.classList.toggle("active",x===b));refresh()});
  $("[data-risk-select]")?.addEventListener("change",refresh);
  $("[data-task-display-toggle]")?.addEventListener("click",e=>{const showCal=$("#taskCalendarView").hidden;$("#taskCalendarView").hidden=!showCal;$("#taskTableView").hidden=showCal;e.currentTarget.textContent=showCal?"返回":"查看日历"});
  $$("[data-overview-filter]").forEach(b=>b.onclick=()=>{const mode=b.dataset.overviewFilter;const list=unfinished(scoped).filter(t=>mode==="mine"?true:mode==="overdue"?t.dueDate&&dueTimestamp(t)<dueTimestamp({dueDate:TODAY,dueTime:"00:00"}):mode==="today"?t.dueDate===TODAY:t.risk&&t.risk!=="—").sort(compareTaskUrgency);body.innerHTML=taskSectionsHTML(list);bindTaskControls()});
  bindCalendarControls();
}
function bindCalendarControls(){$$("[data-calendar-day]").forEach(b=>b.onclick=()=>taskDayModal(b.dataset.calendarDay))}

  $$("[data-modal]").forEach(b=>b.onclick=()=>{const name=b.dataset.modal;if(name==="导入群聊"){importState={source:null,selected:new Set(),range:"7"};importChatModal(1)}else if(name==="新建项目"){projectState={mode:null,selected:new Set()};newProjectModal(1)}else if(name==="新建任务"){newTaskModal()}else if(name==="导入资料"){importAssetModal()}else modal(name,`<p class="meta">暂无更多内容。</p>`)});
  $$("[data-task-view]").forEach(b=>b.onclick=()=>{const viewName=b.dataset.taskView,notes={list:"列表显示当前未完成任务。",schedule:"按日期查看未完成任务。"};$$("[data-task-view]").forEach(x=>x.classList.toggle("active",x===b));setHomeTaskView(viewName);$("#taskNote")&&($("#taskNote").textContent=notes[viewName]);$("#copyTasks")?.toggleAttribute("hidden",viewName!=="list")});
  $$("[data-library-chat]").forEach(b=>b.onclick=()=>{render("library");$("#search").value="";$("#search").dispatchEvent(new Event("input"))});
  $$("[data-library-project]").forEach(b=>b.onclick=()=>{render("library");$("#search").value="";$("#search").dispatchEvent(new Event("input"))});
  $("#copyTasks")?.addEventListener("click",copyOpenTasks);

  $$("[data-all-chat-feed]").forEach(b=>b.onclick=()=>openAllChatFeed(b.dataset.allChatFeed));
  $$("[data-all-project-acts]").forEach(b=>b.onclick=()=>openAllProjectActs(b.dataset.allProjectActs));
  $$("[data-project-filter]").forEach(b=>b.onclick=()=>{$$("[data-project-filter]").forEach(x=>x.classList.toggle("active",x===b));const cards=$(".cards");if(cards){cards.innerHTML=sortedProjects(projectEntriesForAccount(),b.dataset.projectFilter).map(([id,p])=>projectCardHTML(id,p)).join("");bind()}});
  function applyAssetFilter(){const active=$("[data-asset-filter].active")?.dataset.assetFilter||"all";$$("[data-asset]").forEach(r=>r.hidden=active!=="all"&&r.dataset.asset!==active)}
  $$("[data-asset-filter]").forEach(b=>b.onclick=()=>{$$("[data-asset-filter]").forEach(x=>x.classList.toggle("active",x===b));applyAssetFilter()});
  $("[data-asset-sort]")?.addEventListener("change",()=>{const grid=$(".library-grid");if(grid){grid.innerHTML=sortedAssets().map(assetCard).join("");applyAssetFilter()}});
  $$("[data-groups]").forEach(b=>b.onclick=()=>linkedGroupsViewModal(b.dataset.groups));

$("#closeModal").onclick=closeModal;$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};$$("[data-notify-button]").forEach(button=>button.addEventListener("click",openNotificationsModal));$$("[data-user-button]").forEach(button=>button.addEventListener("click",openUserModal));syncNotificationBadge();$("#search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();$$("[data-search]").forEach(x=>x.hidden=q&&!x.dataset.search.toLowerCase().includes(q))});addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").classList.contains("show"))closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#search").focus()}});
const cursor=$(".cursor");addEventListener("mousemove",e=>{cursor.classList.add("show");cursor.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;cursor.classList.toggle("hot",!!e.target.closest("button,[data-chat],[data-project],[data-modal]"))});addEventListener("mousedown",()=>cursor.classList.add("down"));addEventListener("mouseup",()=>cursor.classList.remove("down"));
const canvas=$("#particles"),ctx=canvas.getContext("2d");let pts=[],mouse={x:-9999,y:-9999};function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0);pts=[];for(let y=12;y<innerHeight;y+=24)for(let x=12;x<innerWidth;x+=24)pts.push({x,y})}addEventListener("resize",resize);addEventListener("mousemove",e=>mouse={x:e.clientX,y:e.clientY});function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of pts){const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy),f=Math.max(0,1-d/200),push=f*12,x=p.x+(d?dx/d:0)*push,y=p.y+(d?dy/d:0)*push;ctx.fillStyle=f>.05?`rgba(245,197,24,${.12+f*.32})`:"rgba(80,80,75,.07)";ctx.fillRect(x,y,2+f*2.5,2+f*2.5)}requestAnimationFrame(draw)}resize();draw();renderApp();
</script>
